<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>AIPAR ETA｜Discord 揪團彙總</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #1e1f22;
    color: #dbdee1;
    font: 15px/1.45 "Noto Sans TC", "Segoe UI", system-ui, sans-serif;
    padding: 28px 36px;
  }
  .app { max-width: 720px; }
  .channel { color: #949ba4; font-size: 12px; letter-spacing: .04em; margin-bottom: 18px; }
  .msg { display: flex; gap: 14px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: #f7f6f2; display: grid; place-items: center; overflow: hidden;
  }
  .avatar img { width: 28px; height: 28px; }
  .name { font-weight: 600; color: #f2f3f5; }
  .name span { margin-left: 8px; font-size: 12px; font-weight: 400; color: #949ba4; }
  .embed {
    margin-top: 8px; background: #2b2d31;
    border-left: 4px solid #eabf29;
    border-radius: 4px; padding: 12px 16px 14px; max-width: 520px;
  }
  .embed-author { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #f2f3f5; margin-bottom: 8px; }
  .embed-author img { width: 20px; height: 20px; border-radius: 4px; }
  .embed h2 { margin: 0 0 10px; font-size: 16px; color: #f2f3f5; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .field b { display: block; font-size: 12px; color: #b5bac1; margin-bottom: 4px; }
  .field p { margin: 0; white-space: pre-line; color: #dbdee1; font-size: 14px; }
  .foot { margin-top: 12px; color: #949ba4; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .foot img { width: 16px; height: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; max-width: 520px; }
  .btn {
    background: #248046; color: #fff; border: 0; border-radius: 4px;
    padding: 8px 14px; font: 500 14px/1 "Noto Sans TC", "Segoe UI", sans-serif;
  }
  .btn.grey { background: #4e5058; }
  .btn.gold { background: #b8860b; }
  .chat {
    margin: 16px 0 0 54px; max-width: 520px;
    background: #2b2d31; border-radius: 8px; padding: 10px 12px; font-size: 14px;
  }
  .chat em { color: #00a8fc; font-style: normal; }
  .ack { margin: 8px 0 0 54px; font-size: 13px; color: #f0b232; }
</style>
</head>
<body>
  <div class="app">
    <div class="channel">論壇貼文　·　2026-09-18 雷荷豆腐鍋專賣店</div>
    <div class="msg">
      <div class="avatar"><img src="http://127.0.0.1:3000/assets/logo.svg" alt=""></div>
      <div>
        <div class="name">AIPAR ETA <span>今天 12:10</span></div>
        <div class="embed">
          <div class="embed-author"><img src="http://127.0.0.1:3000/assets/logo.svg" alt="">AIPAR ETA</div>
          <h2>雷荷豆腐鍋專賣店．點餐彙總</h2>
          <div class="fields">
            <div class="field"><b>全體清單</b><p>豆腐鍋 × 2<br>辣炒年糕 × 1<br>地瓜薯條 × 1</p></div>
            <div class="field"><b>每人應付</b><p>Alex　NT$150<br>Sam　NT$200</p></div>
            <div class="field"><b>人數</b><p>2</p></div>
            <div class="field"><b>合計</b><p>NT$350</p></div>
          </div>
          <div class="foot"><img src="http://127.0.0.1:3000/assets/logo.svg" alt="">更新於 2026-09-18 12:14:02　·　開放中</div>
        </div>
        <div class="row">
          <button class="btn">點餐</button>
          <button class="btn grey">我的點餐</button>
          <button class="btn grey">重新整理</button>
          <button class="btn grey">清除我的</button>
          <button class="btn gold">結算</button>
        </div>
      </div>
    </div>
    <div class="chat"><em>@AIPAR ETA</em> 我要一個豆腐鍋跟一份地瓜薯條</div>
    <div class="ack">👀　正在整理點餐⋯⋯</div>
  </div>
</body>
</html>
