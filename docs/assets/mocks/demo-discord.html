<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>AIPAR ETA｜Discord 示意</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body {
    background: #1e1f22;
    color: #dbdee1;
    font: 16px/1.45 "Noto Sans TC", "Segoe UI", system-ui, sans-serif;
    padding: 24px 28px 20px;
  }
  .note { color:#949ba4; font-size:11px; letter-spacing:.06em; margin-bottom:16px; }
  .msg { display:flex; gap:16px; max-width: 740px; }
  .avatar {
    width:40px; height:40px; border-radius:50%; flex:none;
    background:#259fc8; color:#fff; display:grid; place-items:center;
    font-weight:700; font-size:12px; letter-spacing:.04em;
  }
  .meta { font-size:16px; font-weight:600; color:#f2f3f5; }
  .meta span { margin-left:8px; font-size:12px; font-weight:400; color:#949ba4; }
  .embed {
    margin-top:8px; background:#2b2d31; border-left:4px solid #eabf29;
    border-radius:4px; padding:12px 16px 14px; max-width: 540px;
  }
  .embed h2 { margin:0 0 10px; font-size:16px; color:#f2f3f5; }
  .fields { display:grid; grid-template-columns: 1fr 1fr; gap:12px 16px; }
  .field b { display:block; font-size:12px; color:#b5bac1; margin-bottom:4px; }
  .field p { margin:0; white-space:pre-line; color:#dbdee1; font-size:14px; }
  .foot { margin-top:12px; color:#949ba4; font-size:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; max-width:540px; }
  .btn {
    background:#eabf29; color:#231815; border:0; border-radius:4px;
    padding:8px 14px; font: 600 14px/1 "Noto Sans TC", "Segoe UI", sans-serif;
  }
  .btn.grey { background:#4e5058; color:#fff; font-weight:500; }
  .btn.red { background:#a33a3a; color:#fff; font-weight:500; }
  .select {
    background:#4e5058; color:#dbdee1; border:0; border-radius:4px;
    padding:8px 12px; font: 500 14px/1 "Noto Sans TC", "Segoe UI", sans-serif;
  }
  .chat {
    margin: 14px 0 0 56px; max-width: 540px;
    background:#2b2d31; border-radius:8px; padding:10px 12px; font-size:14px;
  }
  .chat em { color:#00a8fc; font-style:normal; }
  .ack { margin:8px 0 0 56px; font-size:13px; color:#eabf29; }
</style>
</head>
<body>
  <div class="note">介面示意 · Discord 揪團貼文</div>
  <div class="msg">
    <div class="avatar">ETA</div>
    <div>
      <div class="meta">AIPAR ETA <span>今天 15:40</span></div>
      <div class="embed">
        <h2>四海豆漿大王．點餐彙總</h2>
        <div class="fields">
          <div class="field">
            <b>全體清單</b>
            <p>蛋餅 × 2<br>豆漿 × 1<br>油條 × 1</p>
          </div>
          <div class="field">
            <b>每人應付</b>
            <p>Alex　NT$75<br>Sam　NT$55</p>
          </div>
          <div class="field">
            <b>人數</b>
            <p>2</p>
          </div>
          <div class="field">
            <b>合計</b>
            <p>NT$130</p>
          </div>
        </div>
        <div class="foot">更新於 2026-09-18 15:44:02　·　開放中</div>
      </div>
      <div class="row">
        <span class="select">數量 2 ▾</span>
        <span class="select">品項 ▾</span>
        <button class="btn">點餐</button>
        <button class="btn grey">我的點餐</button>
        <button class="btn grey">清除我的</button>
        <button class="btn grey">重新整理</button>
        <button class="btn grey">封單</button>
        <button class="btn red">結算</button>
      </div>
    </div>
  </div>
  <div class="ack">👀 已讀取　·　正在對菜單…</div>
  <div class="chat"><em>Sam</em>　我要兩個蛋餅跟一杯豆漿</div>
  <div class="chat"><em>Sam</em>　取消豆漿</div>
</body>
</html>
