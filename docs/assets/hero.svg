    .tag { fill: #5d5a55; font: 400 22px "Segoe UI", "Helvetica Neue", sans-serif; }
    .rule { stroke: #eabf29; stroke-width: 4; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #131518; }
      .frame { stroke: #30353c; }
      .ink, .title, .chip-text { fill: #e9e7e2; }
      .muted, .tag { fill: #a3a8b0; }
      .chip { fill: #1b1e23; stroke: #30353c; }
    }
